<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>ComicTranslator</title>
  <style>
    body {
      width: 280px;
      font-family: system-ui, sans-serif;
      padding: 12px;
      margin: 0;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 8px;
    }
    button {
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      cursor: pointer;
    }
    .status {
      font-size: 12px;
      color: #666;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>ComicTranslator</h1>
  <p>Dịch truyện ZH → VN</p>
  <button id="btn-capture">Bắt đầu chọn vùng</button>
  <button id="btn-auto">Tự động dịch trang</button>
  <div class="status" id="status">Sẵn sàng</div>
  <script src="popup.js"></script>
</body>
</html>
